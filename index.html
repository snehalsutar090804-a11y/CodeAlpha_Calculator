<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Professional Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Hero Section -->
        <div class="hero">
            <h1>Advanced Calculator</h1>
            <p>CodeAlpha Frontend Development Internship</p>
        </div>

        <!-- Date & Time -->
        <div id="datetime"></div>

        <!-- Theme Toggle -->
        <button id="themeBtn" class="theme-btn">
            🌙 Dark Mode
        </button>

        <!-- Calculator -->
        <div class="calculator">

            <!-- Display -->
            <input type="text" id="display" readonly>

            <div class="scientific">
                <button type="button" onclick="percentage()">%</button>
                <button type="button" onclick="squareRoot()">√</button>
                <button type="button" onclick="square()">x²</button>
            </div>
            <!-- Calculator Buttons -->
            <div class="buttons">

                <button class="clear" onclick="clearDisplay()">C</button>
                <button onclick="appendValue('/')">÷</button>
                <button onclick="appendValue('*')">×</button>
                <button onclick="deleteLast()">⌫</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button onclick="appendValue('-')">−</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button onclick="appendValue('+')">+</button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="equal" onclick="calculate()">=</button>

                <button class="zero" onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>

            </div>

        </div>

        <!-- History Panel -->
        <div class="history-box">
            <h3>Calculation History</h3>
            <ul id="history"></ul>
        </div>

    </div>

    <!-- Click Sound -->
    <audio id="clickSound">
        <source src="click.mp3" type="audio/mpeg">
    </audio>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
